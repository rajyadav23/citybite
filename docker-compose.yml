version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: citybite-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: foodapp
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./src/main/resources/db_init.sql:/docker-entrypoint-initdb.d/db_init.sql

  app:
    build: .
    container_name: citybite-app
    restart: always
    ports:
      - "9090:8080"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: foodapp
      DB_USER: root
      DB_PASS: root
    depends_on:
      - db

volumes:
  db_data: